<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090f">
    <meta name="description" content="A tiny interactive experience full of unexpected surprises.">
    <title>Click Me If You Dare ✦</title>
    <link rel="stylesheet" href="style.css">
</head>
<body><div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<main class="container">
    <div class="badge">
        <span class="status-dot"></span>
        YOUR DAILY DOSE OF CHAOS
    </div>

    <h1>Curiosity looks<br>good on <span>you.</span></h1>

    <p class="subtitle">
        One button. Infinite possibilities.<br>
        Absolutely no idea what happens next.
    </p>

    <div class="surprise-card">
        <div class="sparkle">✦</div>

        <p class="card-label">YOUR LITTLE SURPRISE</p>

        <div id="message" aria-live="polite">
            The universe is waiting...
        </div>

        <button id="surpriseButton" type="button">
            <span id="buttonText">Click me if you dare</span>
            <span class="arrow">↗️</span>
        </button>

        <p class="hint" id="hint">No pressure. Just a little curiosity.</p>
    </div>

    <div class="footer">
        <span>MADE WITH <span class="heart">♥️</span> & CURIOSITY</span>
        <span class="footer-right">VOL. 001 · INTERNET MAGIC</span>
    </div>
</main>

<script src="script.js"></script>

</body>
</html>
